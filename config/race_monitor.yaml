race_monitor:
  ros__parameters:

    # --- Start/finish line (two endpoints in map frame) ---
    start_line_p1: [4.30,  1.17]
    start_line_p2: [4.54, -0.42]

    required_laps: 7
    debounce_time: 2.0   # min seconds between lap detections
    frame_id: "map"

    lap_detection:
      expected_direction: "any"          # any | positive (CW) | negative (CCW)
      validate_heading_direction: false

    # --- Logging: minimal | normal | debug | verbose ---
    log_level: "normal"

    results_dir: ""  # empty = package data/ dir

    # --- Race ending: lap_complete | crash | manual ---
    race_ending_mode: "lap_complete"
    auto_shutdown_on_race_complete: true
    shutdown_delay_seconds: 5.0

    crash_detection:
      enable_crash_detection: true
      max_stationary_time: 5.0        # seconds before crash trigger
      min_velocity_threshold: 0.1     # m/s considered "stopped"
      max_odometry_timeout: 3.0       # seconds without odom before crash
      enable_collision_detection: true
      collision_velocity_threshold: 2.0   # m/s sudden change = collision
      collision_detection_window: 0.5     # seconds

    manual_mode:
      save_intermediate_results: true
      save_interval: 30.0      # seconds between auto-saves
      max_race_duration: 0     # seconds, 0 = unlimited

    # --- Controller ---
    controller_name: ""                      # empty = auto-detect from topics
    enable_smart_controller_detection: true
    test_description: "Controller performance evaluation"

    # --- EVO trajectory analysis (requires: pip install evo) ---
    enable_evo: false
    enable_trajectory_evaluation: true
    evaluation_interval_laps: 1
    evaluation_interval_seconds: 0.0
    evaluation_interval_meters: 0.0
    reference_trajectory_file: ""           # empty = no reference
    reference_trajectory_format: "csv"      # csv | tum | kitti

    # --- Analysis ---
    enable_advanced_metrics: true
    calculate_all_statistics: true
    analyze_rotation_errors: true
    enable_geometric_analysis: true
    enable_filtering_analysis: true
    detailed_lap_analysis: true
    comparative_analysis: true
    statistical_significance: true

    enable_race_evaluation: true
    race_evaluation:
      enable_export: true
      auto_increment_experiment: true
      include_recommendations: true
      enable_comparison: false
      grading_strictness: "normal"   # lenient | normal | strict
      focus_on_consistency: true
      focus_on_trajectory_accuracy: true
      focus_on_racing_efficiency: true
      include_detailed_metrics: true
      max_recommendations: 5

    evaluate_smoothness: true
    evaluate_consistency: true
    evaluate_efficiency: true
    evaluate_aggressiveness: true
    evaluate_stability: true

    pose_relations: ["translation_part", "rotation_part", "full_transformation"]
    statistics_types: ["rmse", "mean", "median", "std", "min", "max", "sse"]

    apply_trajectory_filtering: true
    filter_types: ["motion", "distance", "angle"]
    filter_parameters:
      motion_threshold: 0.1
      distance_threshold: 0.05
      angle_threshold: 0.1

    # --- Data export ---
    save_trajectories: true
    save_filtered_trajectories: true
    save_detailed_statistics: true
    export_research_summary: true
    export_to_pandas: true
    save_intermediate_results: true
    include_timestamps: false
    output_formats: ["csv", "json", "pickle", "mat"]

    # --- Graphs ---
    auto_generate_graphs: true
    graph_formats: ["png", "pdf"]
    plot_figsize: [12.0, 8.0]
    plot_dpi: 300
    plot_style: "seaborn"
    plot_color_scheme: "viridis"
    generate_trajectory_plots: true
    generate_xyz_plots: true
    generate_rpy_plots: true
    generate_speed_plots: true
    generate_error_plots: true
    generate_metrics_plots: true
    generate_error_mapped_plots: true
    generate_violin_plots: true
    generate_3d_vector_plots: true

    # --- Computational performance monitoring ---
    enable_computational_monitoring: false
    enable_performance_logging: true
    cpu_monitoring_interval: 1.0
    performance_log_interval: 10.0
    monitoring_window_size: 100
    target_control_frequency_hz: 20.0
    max_acceptable_cpu_usage: 80.0
    max_acceptable_memory_mb: 500.0
    max_acceptable_latency_ms: 100.0

    # --- Topics ---
    odometry_topics: ["/odom", "/car_state/odom", "/ego_racecar/odom"]
    control_command_topics: ["/drive", "ackermann_cmd"]
    controller_config_file: ""
